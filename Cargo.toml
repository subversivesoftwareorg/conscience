[package]
name = "conscience"
version = "0.2.2"
edition = "2024"
description = "Evaluate the impact of AI-assisted work — measuring velocity, quality, business value, developer experience, and ethical implications"
license = "MIT"
repository = "https://github.com/subversivesoftwareorg/conscience"
homepage = "https://github.com/subversivesoftwareorg/conscience"
keywords = ["ai", "ethics", "analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["refs/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
octocrab = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
comfy-table = "7"
colored = "3"
dirs = "6"
toml = "0.8"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
