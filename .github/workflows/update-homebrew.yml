name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        run: sleep 30

      - name: Download checksums
        run: |
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Get source tarball SHA
        run: |
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.release.tag_name }}.tar.gz" | sha256sum | awk '{print $1}' > source_sha.txt
          cat source_sha.txt

      - name: Parse checksums and version
        id: parse
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

          echo "sha_macos_arm64=$(grep 'conscience-macos-arm64' checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha_linux_amd64=$(grep 'conscience-linux-amd64' checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha_linux_arm64=$(grep 'conscience-linux-arm64' checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha_source=$(cat source_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Clone tap repo
        run: |
          git clone https://x-access-token:${{ secrets.SS_HOMEBREW_PUBLISH }}@github.com/subversivesoftwareorg/homebrew-tap.git tap
        env:
          GIT_TERMINAL_PROMPT: "0"

      - name: Update formula
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          TAG="${{ steps.parse.outputs.tag }}"
          SHA_MAC="${{ steps.parse.outputs.sha_macos_arm64 }}"
          SHA_LIN_AMD="${{ steps.parse.outputs.sha_linux_amd64 }}"
          SHA_LIN_ARM="${{ steps.parse.outputs.sha_linux_arm64 }}"
          SHA_SRC="${{ steps.parse.outputs.sha_source }}"

          cat > tap/Formula/conscience.rb << EOF
          class Conscience < Formula
            desc "Evaluate the impact of AI-assisted work"
            homepage "https://github.com/subversivesoftwareorg/conscience"
            version "${VERSION}"
            license "MIT"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/subversivesoftwareorg/conscience/releases/download/${TAG}/conscience-macos-arm64"
              sha256 "${SHA_MAC}"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/subversivesoftwareorg/conscience/releases/download/${TAG}/conscience-linux-arm64"
              sha256 "${SHA_LIN_ARM}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/subversivesoftwareorg/conscience/releases/download/${TAG}/conscience-linux-amd64"
              sha256 "${SHA_LIN_AMD}"
            else
              url "https://github.com/subversivesoftwareorg/conscience/archive/refs/tags/${TAG}.tar.gz"
              sha256 "${SHA_SRC}"
              depends_on "rust" => :build
            end

            def install
              if File.exist?("Cargo.toml")
                system "cargo", "install", *std_cargo_args
              else
                bin.install Dir["conscience*"].first => "conscience"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/conscience --version")
            end
          end
          EOF

          sed -i 's/^          //' tap/Formula/conscience.rb

      - name: Push to tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/conscience.rb
          git commit -m "Update conscience to ${{ steps.parse.outputs.version }}"
          git push origin main
