# Conscience — Ethical Analysis for AI-Assisted Work
#
# This workflow runs ethical analysis on PRs and weekly.
#
# For OTHER repos: copy this file and change the Install step to:
#   cargo install conscience                         # from crates.io
#   cargo install --git https://github.com/subversivesoftwareorg/conscience  # from git
#
# The GITHUB_TOKEN secret is provided automatically by GitHub Actions.

name: Conscience Ethical Analysis

on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    # Weekly Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: read

jobs:
  examine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Conscience
        run: |
          if [ -f Cargo.toml ] && grep -q 'name = "conscience"' Cargo.toml; then
            cargo install --path .
          else
            cargo install --git https://github.com/subversivesoftwareorg/conscience
          fi

      - name: Run Ethical Analysis
        env:
          CONSCIENCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conscience examine \
            --repo ${{ github.repository }} \
            --days 30 \
            --project . \
            --json > conscience-output.json

      - name: Generate Annotations
        run: |
          python3 -c "
          import json
          data = json.load(open('conscience-output.json'))
          for s in data.get('signals', []):
              sev = s.get('severity', 'info')
              level = 'warning' if sev in ('warning', 'concern') else 'notice'
              title = s.get('title', '')
              principle = s.get('principle', '')
              detail = s.get('detail', '')
              print(f'::{level} title={title}::[{principle}] {detail}')
          "

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          CONSCIENCE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Posts the PR-scoped analysis as a comment, editing conscience's
        # earlier comment on the same PR instead of adding another. The body
        # is built from the sanitized export: no paths, commands, or names.
        run: |
          conscience examine \
            --pr ${{ github.event.pull_request.html_url }} \
            --project . \
            --comment
